name: Factory PR Validation

on:
  pull_request:
    branches: [ "master" ]

jobs:
  db-schema-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if DB Schema and 01_db_schema.md are synced
        run: |
          # DB 관련 코드(Prisma, Drizzle 등) 변경 감지 (경로는 실제 프로젝트에 맞게 수정)
          DB_CHANGED=$(git diff --name-only origin/main HEAD | grep -E "schema\.prisma|db/schema\.ts" || true)
          
          # 01_db_schema.md 변경 감지
          MD_CHANGED=$(git diff --name-only origin/main HEAD | grep "01_db_schema.md" || true)

          if [ ! -z "$DB_CHANGED" ] && [ -z "$MD_CHANGED" ]; then
            echo "❌ 에러: DB 관련 코드가 변경되었으나 01_db_schema.md가 업데이트되지 않았습니다."
            echo "팩토리 원칙(SSOT)에 따라 PR 병합을 원천 차단합니다. 수동으로 문서를 업데이트한 후 다시 푸시하십시오."
            exit 1
          else
            echo "✅ DB 문서 정합성 확인 완료."
          fi